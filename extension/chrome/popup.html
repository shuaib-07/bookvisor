<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0e12;
      color: #EDEDED;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 11px;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }
    .title {
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.01em;
    }
    .version {
      font-size: 10px;
      color: #71717A;
      font-family: monospace;
    }
    .status-card {
      padding: 10px 12px;
      border-radius: 10px;
      background: #14161E;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
    }
    .pill-connected {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .pill-disconnected {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .dot-connected { background: #34d399; box-shadow: 0 0 6px rgba(52, 211, 153, 0.6); }
    .dot-disconnected { background: #f87171; }
    .endpoint {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #A1A1AA;
    }
    .endpoint code {
      font-family: monospace;
      color: #60A5FA;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: #2563EB;
      color: white;
      font-weight: 500;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn:hover { background: #1D4ED8; }
    .features {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: #94A3B8;
      line-height: 1.45;
    }
    .features strong {
      color: #E2E8F0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">BV</div>
      <div class="title">BookVisor Bridge</div>
    </div>
    <span class="version">v1.1</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>Desktop Bridge:</span>
      <span id="status-pill" class="pill pill-disconnected">
        <span id="status-dot" class="dot dot-disconnected"></span>
        <span id="status-text">Disconnected</span>
      </span>
    </div>
    <div class="endpoint">
      <span>Port:</span>
      <code>ws://127.0.0.1:49152</code>
    </div>
    <div class="endpoint" style="margin-top: 4px;">
      <span>Browser:</span>
      <span id="browser-label" style="color: #E2E8F0; font-weight: 500;">Detecting...</span>
    </div>
  </div>

  <button id="sync-btn" class="btn">
    Force Sync Bookmarks Now
  </button>

  <div class="features">
    • <strong>Two-Way Sync:</strong> Any bookmark or folder added in BookVisor or your browser updates everywhere in real-time.<br>
    • <strong>Echo-Safe:</strong> Mutex echo-cancellation prevents loopback cycles.
  </div>

  <script src="popup.js"></script>
</body>
</html>
